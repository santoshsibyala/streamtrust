name: NextChat integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/nextchat/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/nextchat.yml'
permissions:
  contents: read
jobs:
  nextchat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test
      - name: Install packaged CLI in a clean consumer
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --save-dev "$RUNNER_TEMP/streamtrust-$(node -p "require('$GITHUB_WORKSPACE/package.json').version").tgz" playwright@1.64.1
          npx --no-install playwright install --with-deps chromium
          npx --no-install streamtrust init nextchat
      - name: Check out the tested NextChat revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ChatGPTNextWeb/NextChat
          ref: 1d3dc331512929a4b1d3e82354e72acce33b5c7a
          path: upstream-nextchat
          persist-credentials: false
      - name: Install pinned NextChat dependencies
        working-directory: upstream-nextchat
        run: npx --yes --package=yarn@1.22.22 -- yarn install --frozen-lockfile --ignore-scripts
      - name: Start NextChat, wait for HTTP readiness, and verify all four scenarios
        working-directory: ${{ runner.temp }}/consumer
        env:
          STREAMTRUST_NEXTCHAT_ROOT: ${{ github.workspace }}/upstream-nextchat
        run: npx --no-install streamtrust verify --adapter nextchat/adapter.mjs --output reports/nextchat --repetitions 3 --timeout-ms 900000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nextchat-safe-reports
          path: |
            ${{ runner.temp }}/consumer/reports/nextchat/report.json
            ${{ runner.temp }}/consumer/reports/nextchat/report.md
            ${{ runner.temp }}/consumer/reports/nextchat/junit.xml
            ${{ runner.temp }}/consumer/reports/nextchat/index.html
          retention-days: 7
