name: Open WebUI integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/open-webui/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/open-webui.yml'
permissions:
  contents: read
jobs:
  open-webui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test
      - name: Install packaged CLI in a clean consumer
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --save-dev "$RUNNER_TEMP/streamtrust-$(node -p "require('$GITHUB_WORKSPACE/package.json').version").tgz" playwright@1.64.1
          npx --no-install playwright install --with-deps chromium
          npx --no-install streamtrust init open-webui
      - name: Start Open WebUI, wait for HTTP readiness, and verify all four scenarios
        working-directory: ${{ runner.temp }}/consumer
        run: npx --no-install streamtrust verify --adapter open-webui/adapter.mjs --output reports/open-webui --repetitions 3 --timeout-ms 900000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: open-webui-safe-reports
          path: |
            ${{ runner.temp }}/consumer/reports/open-webui/report.json
            ${{ runner.temp }}/consumer/reports/open-webui/report.md
            ${{ runner.temp }}/consumer/reports/open-webui/junit.xml
            ${{ runner.temp }}/consumer/reports/open-webui/index.html
          retention-days: 7
