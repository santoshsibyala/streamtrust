name: LibreChat integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/librechat/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/librechat.yml'
permissions:
  contents: read
jobs:
  librechat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm test
      - name: Install packaged CLI in a clean consumer
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --save-dev "$RUNNER_TEMP/streamtrust-$(node -p "require('$GITHUB_WORKSPACE/package.json').version").tgz"
          npx --no-install streamtrust init streamtrust-librechat --preset librechat
          (cd streamtrust-librechat && npm install && npx playwright install --with-deps chromium)
      - name: Build pinned LibreChat
        working-directory: ${{ runner.temp }}/consumer
        run: node streamtrust-librechat/setup.mjs
        env:
          STREAMTRUST_LIBRECHAT_ROOT: ${{ runner.temp }}/librechat
      - name: Verify all four scenarios
        working-directory: ${{ runner.temp }}/consumer
        run: npx --no-install streamtrust verify --adapter streamtrust-librechat/adapter.mjs --output reports/librechat --repetitions 3 --timeout-ms 600000
        env:
          STREAMTRUST_LIBRECHAT_ROOT: ${{ runner.temp }}/librechat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: librechat-safe-reports
          path: |
            ${{ runner.temp }}/consumer/reports/librechat/report.json
            ${{ runner.temp }}/consumer/reports/librechat/report.md
            ${{ runner.temp }}/consumer/reports/librechat/junit.xml
            ${{ runner.temp }}/consumer/reports/librechat/index.html
          retention-days: 7
